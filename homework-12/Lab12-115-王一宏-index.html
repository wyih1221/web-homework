<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Lab12-115-王一宏-styles.css">
    <title>斜坡小球滚动动画</title>
</head>
<body>

    <div class="main-card">
        <h1 class="title">🎱 斜坡小球滚动动画</h1>

        <div class="scene" id="scene">
            <div class="ramp" id="ramp"></div>
            <div class="ball" id="ball"></div>
        </div>

        <div class="controls">
            <label for="speedSelect">⚡ 动画速度：</label>
            <select class="speed-select" id="speedSelect">
                <option value="slow">慢速</option>
                <option value="medium" selected>中速</option>
                <option value="fast">快速</option>
            </select>
            <span class="speed-badge medium" id="speedBadge">中速</span>
        </div>
    </div>

    <script src="Lab12-115-王一宏-styles.js"></script>
</body>
</html>
